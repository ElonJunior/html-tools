<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3;url=https://sub.ikar.eu.org/">
    <title>redirecting...</title>
</head>

<body>
    <p>页面正在跳转，请稍候...</p>
    <p>如果未自动跳转，<a href="https://sub.ikar.eu.org/">请点击这里</a></p>

    <script>
        setTimeout(function () {
            if (window.location.href.indexOf('sub.ikar.eu.org') === -1) {
                window.location.replace('https://sub.ikar.eu.org/');
            }
        }, 3000);
    </script>
</body>

</html>
