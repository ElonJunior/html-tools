<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Subconverter Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        body {
            font-family: "Twemoji Country Flags", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #f8f9fc 0%, #eef1ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #ffffff;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 20px;
        }

        .main-container {
            max-width: 1200px;
            margin: auto;
            margin-top: 70px;
            flex: 1;
        }

        .title {
            font-size: 44px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(90deg, #5b6cff, #8f6bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 50px;
        }

        .card {
            border-radius: 18px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* 语言按钮 */
        .lang-group button {
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-group button.active {
            background: #5b6cff;
            color: white;
            border-color: #5b6cff;
        }

        /* 参数按钮升级 */
        #toggleParams {
            background: #ff9800;
            border: none;
            color: white;
            border-radius: 10px;
            min-width: 120px;
            font-weight: 600;
            transition: all 0.2s;
        }

        #toggleParams:hover {
            background: #f57c00;
        }

        #toggleParams:active {
            background: #e65100;
        }

        footer {
            background: #fff;
            text-align: center;
            padding: 18px 0;
            box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.05);
            font-size: 14px;
        }
    </style>

    <script>
        // 语言检测与设置逻辑
        (function () {
            // 优先从URL参数获取语言（例如 ?lang=en）
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang');

            if (!lang) {
                const browserLang = (navigator.language || navigator.userLanguage).toLowerCase().split('-')[0];
                if (['zh', 'en', 'ru', 'fa'].includes(browserLang)) {
                    lang = browserLang;
                }
            }

            if (!['zh', 'en', 'ru', 'fa'].includes(lang)) {
                lang = 'zh';
            }

            window.INITIAL_LANG = lang;
            document.documentElement.setAttribute('data-lang', lang);
        })();
    </script>
</head>

<body>

    <!-- Header -->
    <nav class="navbar shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">subconverter</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="#" class="nav-link">首页</a>
                <a href="https://github.com/tindy2013/subconverter" target="_blank" class="nav-link">GitHub</a>

                <div class="btn-group lang-group">
                    <button class="btn btn-outline-secondary btn-sm active" data-lang="zh">
                        🇨🇳 中文
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" data-lang="en">
                        🇬🇧 English
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" data-lang="ru">
                        🇷🇺 Russian
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" data-lang="fa">
                        🇮🇷 فارسی <!-- 波斯语通常使用 fa 作为语言代码 -->
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-container">

        <div class="title" data-i18n="title">
            Subconverter 订阅转换
        </div>

        <div class="card p-4">

            <!-- 订阅 -->
            <div class="mb-4">
                <label class="form-label" data-i18n="sub_link"></label>
                <textarea id="subUrl" class="form-control" rows="3" data-i18n-placeholder="sub_placeholder"></textarea>
            </div>

            <!-- 客户端 + 后端 -->
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <label class="form-label" data-i18n="client"></label>
                    <select id="target" class="form-select">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label" data-i18n="backend"></label>
                    <select id="backendSelect" class="form-select">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </select>
                    <input id="backendInput" class="form-control mt-2" data-i18n-placeholder="backend_placeholder"
                        style="display:none;">
                </div>
            </div>

            <!-- 远程配置 -->
            <div class="row mb-4 align-items-end">
                <div class="col-md-9 mb-3">
                    <label class="form-label" data-i18n="config"></label>
                    <select id="configSelect" class="form-select">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </select>
                    <input id="configInput" class="form-control mt-2" data-i18n-placeholder="config_placeholder"
                        style="display:none;">
                </div>

                <div class="col-md-3 mb-3 text-end">
                    <button class="btn" id="toggleParams" data-i18n="params"></button>
                </div>
            </div>

            <!-- 参数 -->
            <div id="paramsBox" style="display:none;">
                <div class="row mb-3">
                    <div class="col-md-6 mb-2">
                        <input class="form-control" id="include" placeholder="include">
                    </div>
                    <div class="col-md-6 mb-2">
                        <input class="form-control" id="exclude" placeholder="exclude">
                    </div>
                </div>
            </div>

            <!-- 输出 -->
            <div class="mb-3">
                <input class="form-control" id="result" readonly>
            </div>

            <button class="btn btn-success w-100" id="convertBtn" data-i18n="convert"></button>

        </div>
    </div>

    <!-- Footer -->
    <footer>
        项目组：
        <a href="https://github.com/tindy2013/subconverter" target="_blank">
            GitHub.com/tindy2013/subconverter
        </a><br>
        <a href="https://github.com/ClashMI" target="_blank" data-i18n="clashmi_link">ClashMI</a> -
        <span data-i18n="clashmi_desc">A powerful Clash GUI</span><br>
        <a href="https://karing.me" target="_blank" data-i18n="karing_link">Karing</a> -
        <span data-i18n="karing_desc">A VPN proxy manager</span>
    </footer>

    <script>
        //START: lang
        $(document).ready(function () {
            const currentLang = window.INITIAL_LANG || 'zh';

            // 加载外部i18n.json文件
            $.getJSON('i18n.json')
                .done(function (i18nData) {
                    window.i18n = i18nData;
                    setLang(currentLang);
                    initLangButtons(currentLang);
                })
                .fail(function (jqxhr, textStatus, error) {
                    console.error("加载语言文件失败: ", textStatus, error);
                });
        });

        function setLang(lang) {
            const i18nData = window.i18n;
            if (!i18nData || !i18nData[lang]) return;

            // 更新所有带 data-i18n 属性的元素
            $("[data-i18n]").each(function () {
                const key = $(this).data("i18n");
                if (i18nData[lang][key]) {
                    $(this).text(i18nData[lang][key]);
                }
            });

            // 更新所有带 data-i18n-placeholder 属性的元素
            $("[data-i18n-placeholder]").each(function () {
                const key = $(this).data("i18n-placeholder");
                if (i18nData[lang][key]) {
                    $(this).attr("placeholder", i18nData[lang][key]);
                }
            });

            // 更新当前语言到全局状态和HTML标签
            window.currentLang = lang;
            document.documentElement.setAttribute('data-lang', lang);
        }

        // 初始化语言按钮的函数
        function initLangButtons(currentLang) {
            // 设置当前语言按钮为激活状态
            $(`.lang-group button[data-lang="${currentLang}"]`).addClass('active');

            // 为按钮绑定点击事件
            $(".lang-group button").click(function () {
                const newLang = $(this).data("lang");
                if (newLang === window.currentLang) return;

                // 更新URL参数，不刷新页面（使用History API）
                const url = new URL(window.location);
                url.searchParams.set('lang', newLang);
                window.history.pushState({}, '', url);

                // 切换语言
                $(".lang-group button").removeClass("active");
                $(this).addClass("active");
                setLang(newLang);
            });
        }

        // 监听浏览器历史记录变化（例如用户点击前进/后退按钮）
        $(window).on('popstate', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const langFromUrl = urlParams.get('lang') || 'zh';
            if (window.i18n && window.i18n[langFromUrl] && langFromUrl !== window.currentLang) {
                $(`.lang-group button`).removeClass('active');
                $(`.lang-group button[data-lang="${langFromUrl}"]`).addClass('active');
                setLang(langFromUrl);
            }
        });
        //END: lang
    </script>

    <script>
        //START: config
        $(document).ready(function () {
            $.getJSON('config.json')
                .done(function (configData) {
                    initSelect('#target', configData.clients);
                    initSelect('#backendSelect', configData.backends);
                    initSelect('#configSelect', configData.configs);

                    initDynamicBehavior();
                })
                .fail(function (jqxhr, textStatus, error) {
                    console.error("加载配置文件失败: ", textStatus, error);
                    alert("load config failed: " + textStatus);
                });
        });

        /**
        * 通用函数：用提供的数据初始化下拉列表
        * @param {string} selector 下拉列表的选择器 (例如 '#target')
        * @param {Array} options 选项数组，每个对象包含 value 和 label 属性
        */
        function initSelect(selector, options) {
            const $select = $(selector);
            $select.empty(); // 清空现有选项
            options.forEach(function (opt) {
                $select.append($('<option>', {
                    value: opt.value,
                    text: opt.label
                }));
            });
        }

        /**
        * 初始化下拉列表相关的动态行为（显示/隐藏自定义输入框等）
        * 这部分是您原有逻辑的迁移和适配
        */
        function initDynamicBehavior() {
            // 后端自定义输入框切换
            $('#backendSelect').change(function () {
                const isCustom = $(this).val() === 'custom';
                $('#backendInput').toggle(isCustom);
                if (!isCustom) {
                    $('#backendInput').val('');
                }
            }).trigger('change'); // 初始化时触发一次以设置正确状态

            // 远程配置自定义输入框切换
            $('#configSelect').change(function () {
                const isCustom = $(this).val() === 'custom';
                $('#configInput').toggle(isCustom);
                if (!isCustom) {
                    $('#configInput').val('');
                }
            }).trigger('change');

            // 参数框显示/切换（保留您原有的逻辑）
            $('#toggleParams').click(function () {
                $('#paramsBox').slideToggle();
            });
        }
        //END: config
    </script>


    <script>
        /* 展开参数 */
        $("#toggleParams").click(() => $("#paramsBox").toggle());

    </script>


    <script type="module" defer>
        // 多语言国旗标
        import { polyfillCountryFlagEmojis } from "https://cdn.skypack.dev/country-flag-emoji-polyfill";
        polyfillCountryFlagEmojis();
    </script>
</body>

</html>
