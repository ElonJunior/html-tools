name: Deploy static content to Cloudflare Pages

on:
  # Runs on pushes targeting the current branch
  push:
    branches:
      - prod
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Debug info
        run: |
          echo "🚀 Workflow triggered by: ${{ github.event_name }}"
          echo "⏰ UTC Time: $(date -u)"
          echo "🇨🇳 Beijing Time: $(TZ='Asia/Shanghai' date)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 使用当前分支
          ref: ${{ github.ref_name }}

      - name: update sitemap and jobs
        run: |
          python scripts/update_sitemap.py
          python scripts/repalce_mark.py
          rm -rf .git* ISSUE_TEMPLATE docs

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # change projectName to your project name
          projectName: ${{ vars.CF_PROJRCT_NAME }}
          directory: ./
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Switch what branch you are publishing to.
          # By default this will be the branch which triggered this workflow
          branch:  ${{ github.ref_name }}
          # Optional: Change the working directory
          # All my website content is in the site folder
          workingDirectory: ./
          # Optional: Change the Wrangler version, allows you to point to a specific version or a tag such as `beta`
          wranglerVersion: '3'

